<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 88" fill="none">
  <defs>
    <linearGradient id="afrinexGrad" x1="0" y1="0" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="12" y1="12" x2="76" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Hexagonal Tech Emblem -->
  <g transform="translate(4, 4)">
    <!-- Outer Hexagon -->
    <path d="M40 4L72 22.5V59.5L40 78L8 59.5V22.5L40 4Z" fill="url(#afrinexGrad)" stroke="#34d399" stroke-width="2" stroke-opacity="0.5" />
    <!-- Inner Dark Cutout Hexagon -->
    <path d="M40 13L64 26.8V54.2L40 68L16 54.2V26.8L40 13Z" fill="#090d16" />
    <!-- Stylized 'A' + Tech Circuit Node Nexus -->
    <path d="M40 21L56 53H47.5L40 37L32.5 53H24L40 21Z" fill="url(#accentGlow)" />
    <!-- Crossbar / Forward Arrow Nexus -->
    <path d="M31 45H49L40 39L31 45Z" fill="#ffffff" />
    <!-- Connection Nodes -->
    <circle cx="40" cy="21" r="3" fill="#ffffff" />
    <circle cx="24" cy="53" r="2.5" fill="#34d399" />
    <circle cx="56" cy="53" r="2.5" fill="#34d399" />
  </g>

  <!-- Company Wordmark (Dark Mode: White + Emerald) -->
  <text x="96" y="50" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" letter-spacing="-0.8" fill="#ffffff">
    Afri<tspan fill="#10b981">Nex</tspan>
  </text>
  <text x="230" y="50" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="600" font-size="34" letter-spacing="-0.5" fill="#cbd5e1">
    Tech
  </text>
  <!-- Subtitle Tagline -->
  <text x="98" y="69" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="600" font-size="10" letter-spacing="3.2" fill="#10b981">
    DIGITAL SOLUTIONS &amp; ENGINEERING
  </text>
</svg>
